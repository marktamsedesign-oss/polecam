<!doctype html>
<html lang="en">

<title>CEF Plan · G-eSAA</title>
<!-- G-eSAA: the CEF plan editor, on its own page inside the app (index.html shows it in a frame), so that its names and styles never meet
     the app's. Made from the CEF-Plan demo, version 17: 30_core.js, 40_iso.js and 50_export.js are the demo's drawing and export engine,
     unchanged; ui.js is the demo's editor, changed for the app. Nothing here is loaded from the internet. -->
<style>

}
@media (prefers-color-scheme: dark){

    --sel:#ffb020; --btn:#e6ebf2; --btn-ink:#11171e; --warn:#ff8a7e; --ok:#58d39a; --chip:#202a36;
    --d-ink:#dfe6ee; --d-tower:#a9b4c2; --d-exis:#6aa9ff; --d-ladder:#4ecb8f; --d-prop:#ff6b5e; --d-dim:#8795a8; --d-photo:#b99cff; --d-ghost:#66748a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1319; --panel:#161c24; --ink:#e6ebf2; --muted:#96a3b4; --line:#2b3542; --line2:#212a35; --paper:#11171e; --grid:#19212a; --grid2:#243040;
  --sel:#ffb020; --btn:#e6ebf2; --btn-ink:#11171e; --warn:#ff8a7e; --ok:#58d39a; --chip:#202a36;

  color-scheme:dark;
}
*{box-sizing:border-box}

:focus-visible{outline:2px solid var(--sel);outline-offset:1px}

.tb{display:flex;align-items:stretch;gap:2px;padding:4px 6px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:thin}.tb[hidden],.tbpop[hidden]{display:none}

.tb button .pi,.tbpop .tile .pi{width:23px;height:23px;stroke-width:1.5}.tb button:hover,.tbpop .tile:hover{background:rgba(127,127,127,.12)}.tb button[aria-pressed=true]{background:var(--ink,#1a212b);color:var(--paper,#fff)}.tb button:disabled{opacity:.35;cursor:default}.tb i{flex:none;width:1px;margin:6px 4px;background:var(--line)}
.tbopt{position:absolute;left:50%;top:6px;transform:translateX(-50%);z-index:5;display:flex;align-items:center;gap:8px;max-width:calc(100% - 12px);overflow-x:auto;padding:4px 6px;border:1px solid var(--line);border-radius:10px;background:var(--panel);box-shadow:0 4px 14px rgba(0,0,0,.16);scrollbar-width:none}.tbopt[hidden]{display:none}

.osel{display:inline-flex;align-items:center;gap:4px;flex:none;font:600 12px var(--f-ui);color:var(--muted)}.osel select{height:32px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);font:600 12.5px var(--f-ui);padding:0 4px;max-width:132px}.views.has-opt .cap{top:54px}

.modebar .mi{display:inline-flex;align-items:center;gap:2px;font-style:normal}.modebar .mi .pi{width:19px;height:19px}
details.fold{margin:10px 0 0;border-top:1px solid var(--line)}details.fold>summary{cursor:pointer;padding:9px 0;font:700 13px var(--f-ui);display:flex;align-items:center;gap:7px;list-style:none}details.fold>summary::-webkit-details-marker{display:none}details.fold>summary::after{content:'▾';margin-left:auto;color:var(--muted)}details.fold[open]>summary::after{content:'▴'}details.fold.w>summary{color:var(--d-prop,#d13029)}
.seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--paper)}

.view{position:relative;min-width:0;min-height:0}

.views[data-v="top"] #vIso,.views[data-v="top"] #vSheets,.views[data-v="iso"] #vTop,.views[data-v="iso"] #vSheets,.views[data-v="both"] #vSheets,.views[data-v="sheets"] #vTop,.views[data-v="sheets"] #vIso{display:none}
.modebar{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center;width:max-content;max-width:calc(100% - 12px);background:var(--btn);color:var(--btn-ink);padding:5px 6px 5px 11px;border-radius:9px;font-size:13px;font-weight:500;box-shadow:0 4px 14px rgba(0,0,0,.22)}

.status{display:flex;gap:10px;align-items:center;padding:6px 10px;border-top:1px solid var(--line);font:400 12px var(--f-mono);color:var(--muted);min-height:29px}

.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.tabbody{flex:1;min-height:0;overflow:auto;padding:12px 14px 18px}
.home{display:grid;gap:8px}.home .hb{display:grid;grid-template-columns:28px minmax(0,1fr);gap:1px 10px;align-items:center;text-align:left;border:1px solid var(--line);border-radius:10px;background:var(--paper,#fff);color:var(--ink);padding:9px 12px;cursor:pointer;font:600 14px var(--f-ui)}
.home .hb .pi{grid-row:1 / span 2;width:24px;height:24px;stroke-width:1.5}.home .hb b{font-weight:600}.home .hb small{grid-column:2;font:500 12px var(--f-ui);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.home .hb:hover{border-color:var(--ink)}
.ctxh{display:flex;align-items:center;gap:10px;margin:-2px 0 12px;padding-bottom:9px;border-bottom:1px solid var(--line2)}.ctxh b{font:600 14px var(--f-head);letter-spacing:.05em;text-transform:uppercase}.ctxh .b .pi{width:16px;height:16px;vertical-align:-3px;margin-right:2px}

.eyes{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 2px}.eye{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:3px 10px;border:1px solid var(--line);border-radius:16px;background:var(--paper);color:inherit;font:inherit;font-size:13px;cursor:pointer;text-align:left}

/* ---- G-eSAA: this page runs inside the app (a full-screen frame) ---- */
html,body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
.app{padding-top:max(10px,env(safe-area-inset-top,0px));padding-bottom:max(12px,env(safe-area-inset-bottom,0px))}
.guide{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--sel);border-radius:8px;padding:6px 8px 6px 10px;font-size:14px}
.guide b{font:600 13px/1 var(--f-head);letter-spacing:.06em;text-transform:uppercase;color:var(--sel);white-space:nowrap}
.guide span{flex:1 1 180px;min-width:0}
.guide.done{border-left-color:var(--ok)}.guide.done b{color:var(--ok)}
.guide.view{border-left-color:var(--muted)}.guide.view b{color:var(--muted)}
.nologo{font:500 12px var(--f-mono);color:var(--muted)}
.viewonly .chip.vo{display:inline-block}.chip.vo{display:none}
#nohost{padding:24px 16px;font-size:16px;max-width:520px;margin:0 auto}
input:disabled,select:disabled{opacity:.7;background:var(--chip)}
button:disabled{opacity:.5;cursor:default}

/* ---- (14 Nov, MarkT) a phone: the drawing takes the screen. body.phone is set by the editor when the screen is 900 px wide or less ---- */
.shd,.fab{display:none}
body.phone{--peek:70px}

body.phone .bar .seg{flex:0 1 auto;min-width:0;margin-right:auto;overflow-x:auto;scrollbar-width:none}
body.phone .bar .seg button{height:34px;padding:0 10px;font-size:13px;flex:none}
body.phone #bUndo{width:40px;height:34px;padding:0;display:inline-flex;align-items:center;justify-content:center;flex:none}body.phone #bUndo span{display:none}body.phone #bUndo .pi{width:20px;height:20px}
body.phone #bDone{height:34px;flex:none}body.phone #bBack{height:34px;max-width:46vw;overflow:hidden;text-overflow:ellipsis}
body.phone .guide{border-radius:0;border-width:0 0 1px 4px;padding:3px 6px 3px 8px;font-size:12.5px;gap:6px;flex-wrap:nowrap}
body.phone .guide span{flex:1 1 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}body.phone .guide b{font-size:11.5px}body.phone .guide .b{height:28px}
body.phone .desk{display:block;position:relative;flex:1;min-height:0}

body.phone .tools,body.phone .cap{display:none}
body.phone .panel{position:absolute;left:0;right:0;bottom:0;height:var(--peek);z-index:30;border-width:1px 0 0;border-radius:14px 14px 0 0;box-shadow:0 -6px 18px rgba(0,0,0,.16);transition:height .2s ease}

body.phone .shd .shc{flex:none;width:8px;height:8px;margin:5px 4px 0 auto;border:solid var(--muted);border-width:2px 2px 0 0;transform:rotate(-45deg)}

<body>
<div id="nohost" hidden><h2>CEF Plan</h2><p>This page is part of G-eSAA. Open a CEF plan from the app: Projects, then a CEF-Plan project, or the site pin of an As-Plan project.</p></div>
<div class="app">
  <header class="bar">
    <div class="brand"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6l4 18H5L9 3zM7.6 9.5h8.8M6.4 15h11.2M9 3l7.4 6.5L6.4 15M15 3L7.6 9.5 17.6 15"/></svg>CEF Plan<span class="chip vo">view only</span></div>

  </header>
  <div class="guide" id="guide" hidden></div>
  <div class="desk">
    <section class="stage" aria-label="Drawing">

          <button data-v="top" role="tab">Sketch</button><button data-v="iso" role="tab">Isometric</button><button data-v="both" role="tab" class="wide">Both</button><button data-v="sheets" role="tab">Sheets</button>
        </div>
        <span class="sp"></span>
        <button class="b s" id="bTurn" title="Look at the site from the next corner">Turn</button>
        <button class="b s ic" id="bOut" aria-label="Zoom out">&minus;</button><button class="b s ic" id="bIn" aria-label="Zoom in">+</button><button class="b s" id="bFit">Fit</button>
      </div>
      <div class="tb" id="tb" role="toolbar" aria-label="Drawing tools" hidden></div>
      <div class="views" id="views" data-v="top">
        <div class="view" id="vTop"><svg id="svgTop" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Top view sketch of the site"></svg><span class="cap">Top view &middot; sketch here</span></div>
        <div class="view" id="vIso"><svg id="svgIso" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Isometric view of the site"></svg><span class="cap" id="capIso">Isometric &middot; follows the sketch</span></div>
        <div class="view" id="vSheets"><svg id="svgSheets" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sheets as they will be exported"></svg><span class="cap">Sheets &middot; as exported</span></div>
        <div class="tbopt" id="tbopt" hidden></div>
        <div class="tbpop" id="tbpop" hidden></div>
        <div class="modebar" id="modebar" hidden></div>
        <div class="fab" id="fab"></div>
      </div>
      <div class="status" id="status"></div>
    </section>

      <div class="shd" id="shd" role="button" tabindex="0" aria-expanded="false" aria-label="Show the form"><span class="grip" aria-hidden="true"></span><span class="shc" aria-hidden="true"></span></div>
      <nav class="tabs" id="tabs" role="tablist">
        <button data-tab="site" role="tab">Site</button><button data-tab="els" role="tab">Elements</button><button data-tab="route" role="tab">Route</button><button data-tab="photos" role="tab">Photos</button><button data-tab="table" role="tab">Table</button><button data-tab="export" role="tab">Export</button>
      </nav>
      <div class="tabbody" id="panel"></div>
    </aside>
  </div>
</div>
